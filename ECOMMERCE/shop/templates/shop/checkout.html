{% extends "shop/base.html" %}
{% block content %}
    <div class="row">
        <div class="col-md-12">
            <ul class="list-group" id="item-list">
                <h1 class="text-center">Liste de vous articles</h1>
                
            </ul>
        </div>
    </div>
    <div class="row">
        <div class="col-12">
            <form method="POST">
                {% csrf_token %}
                <input type="hidden" id="items" name="items">
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="inputNom">Nom</label>
                        <input name="nom" type="text" class="form-control" id="nom" placeholder="Nom">
                    </div>
                                        
                    <div class="form-group col-md-6">
                        <label for="inputEmail4">Email</label>
                        <input name="email" type="text" class="form-control" id="email" placeholder="Email">
                    </div>
                    
                </div>
                <div class="form-group">
                    <label for="inputAddress">Address</label>
                    <input name="adresse" type="text" class="form-control" id="adresse" placeholder="Cité hassani">
                </div>
                
                <div class="form-row"> 
                    <div class="form-group col-md-6">
                    <label for="inputCity">Ville</label>
                    <input name="ville" type="text" class="form-control" id="ville">
                    </div>
                    <div class="form-group col-md-4">
                    <label for="inputState">Pays</label>
                    <select name="pays" id="pays" class="form-control">
                        <option selected>Maroc</option>
                        <option>...</option>
                    </select>
                    </div>
                    <div class="form-group col-md-2">
                        <label for="inputZip">Zip</label>
                        <input name="zipcode" id="zipecode" type="text" class="form-control">
                    </div>
                    <div class="form-group col-md-2">
                        <div class="row">
                            <label for="inputZip">Montant de la commande</label>
                            <input name="montant" id="montant" class="bg-blue text-read form-control" readonly>
                            <b>MAD</b>
                        </div>
                        
                    </div>
                </div>
                
                <button type="submit" class="btn btn-primary">Commander</button>
            </form>


        </div>
    </div>
{% endblock  %}

{% block js %}
    <script type="text/javascript">
        if (localStorage.getItem('panier')== null) {
            var panier={};
        }else {
            panier =JSON.parse(localStorage.getItem('panier'));
        }
        var tqte = 0;
        var tprix =0;
        for (item in panier){
            let nom=panier[item][1];
            let qte=panier[item][0];
            let prix=panier[item][2];
            tqte += qte;
            tprix += prix
            let itemStr=` 
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    ${nom}
                    <span class="badge badge-primary badge-pill ">
                        <b>${qte}</b>
                    </span>
                    <span class="badge badge-warning badge-pill">
                        <b>${prix}</b>
                    </span>
                </li>
                 `;
                
            $('#item-list').append(itemStr);
        }
        let itemTotaux=` 
            <li class="list-group-item d-flex justify-content-between align-items-center">
                <b class="badge badge-warning">Totaux</b>
                <span class="badge badge-primary badge-pill">
                    <b>${tqte}</b>
                </span>
                <span class="badge badge-warning badge-pill">
                    <b>${tprix}</b>
                </span>
            </li> `;
        $('#item-list').append(itemTotaux);
        $('#items').val(JSON.stringify(panier));
        $('#montant').val(tprix);


    </script>
{% endblock  %}
